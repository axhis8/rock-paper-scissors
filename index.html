<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="./style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <div class="gameTitle">Rock Paper Scissors</div>

    <div class="topUI">
      <div id="score">SCORE</div>
      <div id="winText">Welcome!</div>
    </div>

    <div class="mainUI">
      <div class="users player">
        <div class="playerName">YOU</div>
        <div id="buttons" class="hands">
          <img id="rock" class="hand" src="images/rock.png" alt="rock" />

          <img id="paper" class="hand" src="images/paper.png" alt="paper" />

          <img
            id="scissors"
            class="hand"
            src="images/scissors.png"
            alt="scissors"
          />
        </div>
      </div>

      <div class="users computer">
        <img
          class="computerIcon"
          src="images/computerIcon.svg"
          alt="computer icon"
        />
        <img id="computerHand" src="images/paper.png" alt="hand" />
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
