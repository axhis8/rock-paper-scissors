<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="./style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <div id="game-title">Rock Paper Scissors</div>
    <div id="top-ui">
      <div class="rounds-played"></div>
      <div class="score">Welcome</div>
      <div class="win-text">Best of 5!</div>
    </div>

    <div id="main-ui">
      <div class="users player">
        <div class="player-name">YOU</div>
        <div class="buttons">
          <img class="rock hand" src="images/rock.png" alt="rock" />

          <img class="paper hand" src="images/paper.png" alt="paper" />

          <img class="scissors hand" src="images/scissors.png" alt="scissors" />
        </div>
      </div>

      <div class="users computer">
        <img
          class="computer-icon"
          src="images/computerIcon.png"
          alt="computer icon"
        />
        <img class="computer-hand" src="images/paper.png" alt="hand" />
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
