<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="./style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <div class="gameTitle">Rock Paper Scissors</div>

    <div class="players">
      <div class="users player">
        <div class="playerName">YOU</div>
        <div id="buttons" class="hands">
          <button id="rock">
            <img class="hand" src="images/rock.png" alt="rock" />
          </button>

          <button id="paper">
            <img class="hand" src="images/paper.png" alt="paper" />
          </button>

          <button id="scissors">
            <img class="hand" src="images/scissors.png" alt="scissors" />
          </button>
        </div>
      </div>

      <div class="users computer">
        <img
          class="computerIcon"
          src="images/computerIcon.svg"
          alt="computer icon"
        />
        <img id="computerHand" src="images/paper.png" alt="hand" />
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
